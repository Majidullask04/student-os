# amplify.yml   (place at the REPO ROOT)
#
# AWS Amplify Hosting builds and deploys the frontend automatically on every
# push to the connected branch (main). No GitHub Action is needed for it.
#
# In the Amplify console, set these environment variables:
#   AMPLIFY_MONOREPO_APP_ROOT = frontend
#   VITE_API_URL              = https://<your-app-runner-domain>   (no trailing slash)
# VITE_API_URL is baked in at build time: if it changes, redeploy the app.

version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            # Vite needs Node 20.19+ or 22.12+; Amplify's default can be older
            - nvm install 22
            - nvm use 22
            - node --version
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
