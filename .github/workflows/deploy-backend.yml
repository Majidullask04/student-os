# .github/workflows/deploy-backend.yml
#
# main branch push  ->  run tests  ->  build Docker image  ->  push to ECR
#
# Required GitHub settings:
#   Secret  AWS_ROLE_ARN            IAM role GitHub assumes via OIDC (no stored keys)
#   Variable AWS_REGION             optional, defaults to ap-south-1

name: Deploy backend to AWS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

# Never run two deployments at once
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC login to AWS
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: student-os-backend

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all test suites
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python tests/test_agent_flow.py
          python tests/test_job_search_agent.py
          python tests/test_adaptive_loop.py
          python tests/test_personalization_eval.py
          python tests/test_schema_v2_and_rag.py

  deploy:
    name: Build and push backend image to ECR
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
