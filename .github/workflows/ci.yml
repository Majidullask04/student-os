# .github/workflows/ci.yml   (replaces your existing ci.yml)
#
# Runs on your working branch and on pull requests, so problems are caught
# BEFORE you merge to main (where deploy-backend.yml takes over).

name: Student OS CI

on:
  push:
    branches: [majid-1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run all test suites
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python tests/test_agent_flow.py
          python tests/test_job_search_agent.py
          python tests/test_adaptive_loop.py
          python tests/test_personalization_eval.py
          python tests/test_schema_v2_and_rag.py

  backend-docker-build:
    name: Backend Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22        # Vite needs Node 20.19+ or 22.12+
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
